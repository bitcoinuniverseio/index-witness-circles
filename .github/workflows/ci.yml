name: ci
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Resolves the exact dependency state once. Every gate below reuses it.
  prepare:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 20
    outputs:
      dependency-key: ${{ steps.env.outputs.dependency-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: env
        uses: bitcoinuniverseio/.github-private/.github/actions/universe-node-env@develop

  format:
    needs: prepare
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bitcoinuniverseio/.github-private/.github/actions/universe-node-env@develop
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high

  lint:
    needs: prepare
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bitcoinuniverseio/.github-private/.github/actions/universe-node-env@develop
      - run: npm run lint

  typecheck:
    needs: prepare
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bitcoinuniverseio/.github-private/.github/actions/universe-node-env@develop
      - run: npm run typecheck

  test:
    needs: prepare
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bitcoinuniverseio/.github-private/.github/actions/universe-node-env@develop
      - run: npm test

  build:
    needs: prepare
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bitcoinuniverseio/.github-private/.github/actions/universe-node-env@develop
      - run: npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: index-witness-circles-dist-${{ github.sha }}
          path: dist
          retention-days: 7
          compression-level: 1

  ci:
    name: ci
    needs: [prepare, format, lint, typecheck, test, build]
    if: always()
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 5
    steps:
      - name: Require every gate to have passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
