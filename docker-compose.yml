services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_bin']
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-witness_circles}
      MYSQL_USER: ${MYSQL_USER:-witness}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - witness-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    command: ['node', 'dist/database/migrate.js']
    env_file: .env
    environment:
      MYSQL_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  indexer:
    build: .
    env_file: .env
    environment:
      MYSQL_HOST: mysql
    ports:
      - '${PORT:-3012}:${PORT:-3012}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3012)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  witness-mysql:
